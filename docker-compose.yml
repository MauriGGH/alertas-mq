# Infraestructura - Fase 1
# Pensado para laptop de 8 GB: Kafka limitado a ~768 MB de heap, Postgres ajustado.
# Uso:
#   docker compose up -d                       -> Kafka + Postgres + creación de topics
#   docker compose --profile tunnel up -d      -> además levanta el túnel de Cloudflare
#   docker compose --profile tools up -d       -> además Kafka UI (consume ~400 MB, opcional)

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: alertas-kafka
    user: root   # simplifica permisos del volumen (entorno de práctica)
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # modo KRaft: sin Zookeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # los topics se crean explícitamente
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: alertas-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: alertas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: alertas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alertas}
      POSTGRES_DB: alertas
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100", "-c", "work_mem=4MB"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertas -d alertas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: alertas-tunnel
    profiles: ["tunnel"]
    network_mode: host   # así el túnel alcanza http://localhost:3000 del host
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: alertas-kafka-ui
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: alertas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  pg-data:
